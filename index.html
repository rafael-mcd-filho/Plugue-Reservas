    <meta property="og:title" content="Plugue Guest | Sistema de Reservas" />

    <!-- Sem imagem estática de compartilhamento o card grande fica vazio; o Home promove
         para summary_large_image quando existe logo do sistema. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Plugue Guest | Sistema de Reservas" />

      name="twitter:description"
      content="Reserva descomplicada, controle das perdas e relatórios com a ocupação real da casa. Abra cada noite sabendo o que esperar do salão."
    />
    <style>
      .initial-page-loader {
        align-items: center;
        background: hsl(38 26% 92%);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .initial-page-loader__mark {
        animation: initial-page-pulse 1.5s ease-in-out infinite;
        background: hsl(35 14% 84%);
        border-radius: 999px;
        height: 96px;
        width: 96px;
      }
      .initial-page-loader__label {
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      @keyframes initial-page-pulse {
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-page-loader__mark { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="initial-page-loader" role="status">
        <div class="initial-page-loader__mark" aria-hidden="true"></div>
        <span class="initial-page-loader__label">Carregando página</span>
      </div>
    </div>
    <script type="module" src="/src/publicCompanyBootstrap.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
